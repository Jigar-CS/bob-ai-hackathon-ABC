[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portpulse"
version = "1.0.0"
description = "Port congestion prediction and 72-hour berth operations planning, with IBM watsonx.ai routing reasoning."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Team ABC" }]
keywords = ["logistics", "ports", "congestion", "fastapi", "watsonx"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  "fastapi==0.116.2",
  "uvicorn[standard]==0.36.0",
  "pydantic==2.11.9",
  "pydantic-settings==2.13.1",
  "python-dotenv==1.1.1",
  "python-multipart==0.0.20",
  "requests==2.32.5",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.18.2",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.14.0",
  "types-requests==2.32.4.20260107",
]

[project.urls]
Homepage = "https://github.com/Jigar-CS/bob-ai-hackathon-ABC"
Documentation = "https://github.com/Jigar-CS/bob-ai-hackathon-ABC/tree/main/docs"
Issues = "https://github.com/Jigar-CS/bob-ai-hackathon-ABC/issues"

[project.scripts]
portpulse = "portpulse.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portpulse = ["static/*.html", "data/*.csv", "data/*.json"]

# ── Ruff (lint + format) ─────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
  "ARG", # unused arguments
  "PTH", # prefer pathlib
  "TID", # tidy imports
]
ignore = [
  "B008", # FastAPI dependency injection relies on calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["portpulse"]

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
]
markers = [
  "integration: tests that exercise the full HTTP stack",
]
filterwarnings = ["error::DeprecationWarning:portpulse.*"]

# ── coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["portpulse"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  'if __name__ == "__main__":',
]
