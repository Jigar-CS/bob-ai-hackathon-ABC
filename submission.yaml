submission:
  title: "PortPulse - Container Congestion Predictor & Port Operations Optimiser" # REQUIRED

  problem_statement: >                 # REQUIRED
    The 2021 LA/Long Beach port backlog had 100+ ships waiting offshore for weeks,
    costing global supply chains $10B+. Port operators allocate berths, cranes, and
    yard space across hundreds of vessels manually in spreadsheets. Congestion hotspots
    are identified reactively — after vessels are already queuing — and alternate routing
    decisions come too late to help.

  solution_summary: >                  # REQUIRED
    PortPulse is an AI-assisted port operations solution that predicts congestion hotspots
    using vessel schedules and berth capacity data, recommends alternate routing strategies
    via IBM watsonx.ai reasoning, optimizes berth and crane assignments by priority, and
    generates a ready-to-use 72-hour port operations plan for shift supervisors.

  key_features:                        # REQUIRED
    - "72-hour congestion risk forecasting across rolling 24-hour berth capacity windows"
    - "Priority-based automated berth and crane assignment with an auditable reason per decision"
    - "AI-generated alternate port routing recommendations for unassigned vessels"
    - "Live operations dashboard plus CSV upload and spreadsheet-ready plan export"

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI", "Pydantic"]
    ibm_technologies: ["IBM watsonx.ai", "IBM Bob"]
    databases: []
    other: ["Uvicorn", "Docker", "GitHub Actions", "pytest", "Ruff", "mypy"]

  what_we_are_most_proud_of: >
    The end-to-end flow from raw vessel/berth data to a single actionable
    72-hour operations plan, with AI reasoning applied specifically where
    it adds value — explaining why a vessel is being rerouted — rather
    than as a decorative wrapper.

  known_limitations: >
    Uses a greedy assignment algorithm rather than full optimization;
    runs on synthetic CSV data rather than a live port scheduling feed;
    routing recommendations use a small fixed list of alternate ports.

