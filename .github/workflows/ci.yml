name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  # Guarantees no test can reach IBM Cloud even if a secret leaks into the env.
  WATSONX_API_KEY: ""
  WATSONX_PROJECT_ID: ""

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check --diff .

      - name: mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  smoke:
    name: Application smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Boot the server and exercise every endpoint
        run: |
          set -euo pipefail
          python -m uvicorn portpulse.main:app --host 127.0.0.1 --port 8000 \
            > uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 1
          done

          curl -sf http://127.0.0.1:8000/health | grep -q '"status":"healthy"'
          curl -sf http://127.0.0.1:8000/api/v1/plan | grep -q 'berth_assignments'
          curl -sf http://127.0.0.1:8000/api/v1/plan/export.csv | head -1 | grep -q 'vessel_id'
          curl -sf http://127.0.0.1:8000/api/v1/templates/vessels | grep -q 'vessel_id'
          curl -sf http://127.0.0.1:8000/ | grep -q 'PortPulse'
          echo "Smoke test passed"

      - name: Server log
        if: always()
        run: cat uvicorn.log || true

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: portpulse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the container serves traffic
        run: |
          set -euo pipefail
          docker run -d --name portpulse-ci -p 8000:8000 \
            -e PORTPULSE_ENVIRONMENT=development \
            portpulse:ci
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health | grep -q '"status":"healthy"'
          echo "Container responded successfully"

      - name: Container logs
        if: always()
        run: docker logs portpulse-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f portpulse-ci || true
